# Continuous Integration for projects using Docker
#
# on:
#   pull_request:
#     types: [opened, reopened, synchronize]
# concurrency:
#      group: "ci__${{ github.event.pull_request.number }}"
#      cancel-in-progress: true
# jobs:
#   ci:
#     uses: TorqIT/shopware-github-actions-workflows/.github/workflows/ci-docker.yml@v8
#     permissions:
#       contents: read
#       actions: read
#       pull-requests: write  # required for post-scan-report to comment on PRs
#     secrets:
#       SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
#       BUILD_TIME_SECRETS: >
#         {
#            "my-secret": "${{ secrets.MY_SECRET }}",
#            ...any other build-time secrets you need
#         }
#       RUN_TIME_SECRETS: >
#         {
#            "my-secret": "${{ secrets.MY_SECRET }}",
#            ...any other run-time secrets you need
#         }
#

name: CI

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        description: Optional self-hosted runner for this workflow (see https://github.com/TorqIT/shopware-github-actions-workflows#self-hosted-runners)
      PROJECT_REPOSITORY:
        required: false
        default: "${{ github.repository }}"
        type: string
        description: "The GitHub repository of the project containing Shopware"
      PROJECT_REPOSITORY_REF:
        required: false
        default: "${{ github.head_ref }}"
        type: string
        description: "The Git reference (branch, tag, commit SHA) to checkout from the project repository"
      SUBMODULES:
        required: false
        type: boolean
        default: false
        description: "Whether to clone submodules when cloning the project repository"
      BUILD_TIME_ARGS:
        required: false
        type: string
        default: "{}"
        description: "A JSON object containing Docker build-time args in key: value format"
      SHOPWARE_ROOT:
        required: false
        type: string
        default: "."
        description: "The path (relative to the project's root) in which the Shopware files are stored (e.g. config, src, etc)"
      INIT:
        required: false
        type: boolean
        default: true
        description: "Whether the project uses an init container"
      INIT_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the init image"
      INIT_DOCKER_TARGET:
        required: false
        type: string
        default: "init"
        description: "The Docker target to use when building the init image"
      PHP_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the PHP image"
      PHP_DOCKER_TARGET:
        required: false
        type: string
        default: "php"
        description: "The Docker target to use when building the PHP image"
      SUPERVISORD_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the supervisord image"
      SUPERVISORD_TARGET:
        required: false
        type: string
        default: "supervisord"
        description: "The Docker target to use when building the supervisord image"
      E2E_TESTS_DIRECTORY:
        required: false
        type: string
        default: ""
        description: "The directory containing end-to-end tests"
      E2E_TESTS_HOSTNAME:
        required: false
        type: string
        default: ""
        description: "The hostname to use when running end-to-end tests"
      NODE_VERSION:
        required: false
        type: string
        default: "20"
        description: "The Node.js version to use when running end-to-end tests"
      PHP_DOCKER_COMPOSE_SERVICE:
        required: false
        type: string
        default: "php"
        description: "The name of the PHP service in Docker Compose"
      RUN_UNIT_TESTS:
        required: false
        type: boolean
        default: false
        description: "Whether to run unit tests. Default: false, but will be true in future versions"
      UNIT_TESTS_DIRECTORY:
        required: false
        type: string
        default: "tests"
        description: "The directory where unit tests are located - note this should be relative to the Shopware root, as once inside the container the working directory is set to the Shopware root"
      RUN_PHPSTAN:
        required: false
        type: boolean
        default: false
        description: "Whether to run PHPStan static analysis. Default: false, but will be true in future versions"
      PHPSTAN_ARGS:
        required: false
        type: string
        default: ""
        description: "Additional arguments to append to the phpstan analyse command (e.g. --memory-limit=1G)"
      GITHUB_APP_CHECKOUT:
        required: false
        type: boolean
        default: false
        description: "Whether to use a GitHub App token for checking out the project repository and submodules"
      POST_SCAN_RESULTS_TO_PR:
        required: false
        type: boolean
        default: false
        description: "Whether to post vulnerability scan results to the associated PR"
      TRIVYIGNORE_PATH:
        required: false
        type: string
        default: ""
        description: "Path to .trivyignore.yaml file (e.g. ./.trivyignore.yaml)"

    secrets:
      SHOPWARE_COMPOSER_TOKEN:
        required: true
        description: The value of your project's Shopware Composer token
      BUILD_TIME_SECRETS:
        required: false
        description: A JSON object of secrets required at build-time (see above for example format)
      RUN_TIME_SECRETS:
        required: false
        description: A JSON object of secrets required at run-time (see above for example format)
      GITHUB_APP_ID:
        required: false
        description: The ID of the GitHub App used to generate a token for checking out the project repository and submodules
      GITHUB_APP_PRIVATE_KEY:
        required: false
        description: The private key of the GitHub App used to generate a token for checking out the project repository and submodules

jobs:
  lint:
    name: Lint files
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Lint all files
        uses: ./reusable-workflow/.github/actions/lint

  vulnerability-scan:
    name: Scan for vulnerabilities in dependencies and code (SCA and SAST)
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    outputs:
      npm-outcome: ${{ steps.npm-scan.outcome }}
      composer-outcome: ${{ steps.composer-scan.outcome }}
      semgrep-outcome: ${{ steps.semgrep-scan.outcome }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Scan for npm vulnerabilities
        id: npm-scan
        continue-on-error: true
        run: |
          result=0
          > /tmp/npm-audit.txt
          while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            dir_slug=$(echo "$dir" | sed 's|^\./||;s|/|__|g')
            echo "--- Scanning $dir ---" | tee -a /tmp/npm-audit.txt
            npm audit --omit=dev --prefix "$dir" 2>&1 | tee -a /tmp/npm-audit.txt || true
            npm audit --json --omit=dev --prefix "$dir" 2>/dev/null \
              | jq --arg dir "$dir" '. + {_scannedDir: $dir}' \
              > "/tmp/npm-raw-${dir_slug:-root}.json" || true
            jq '[.packages // {} | to_entries[] | select(.key | test("^node_modules/(@[^/]+/[^/]+|[^/]+)$")) | {name: (.key | ltrimstr("node_modules/")), version: .value.version}]' \
              "$dir/package-lock.json" > "/tmp/npm-packages-${dir_slug:-root}.json" 2>/dev/null || echo '[]' > "/tmp/npm-packages-${dir_slug:-root}.json"
            fixable_count=$(jq '[(.vulnerabilities // {}) | to_entries[] | select((.value.severity == "high" or .value.severity == "critical") and .value.fixAvailable == true)] | length' "/tmp/npm-raw-${dir_slug:-root}.json" 2>/dev/null || echo 0)
            if [ "$fixable_count" -gt 0 ]; then
              result=1
            else
              echo "No fixable high/critical vulnerabilities found" | tee -a /tmp/npm-audit.txt
            fi
          done < <(find . -name "package-lock.json" -not -path "*/node_modules/*" -print0)
          exit $result

      - name: Scan for composer vulnerabilities
        id: composer-scan
        continue-on-error: true
        run: |
          SHOPWARE_COMPOSER_TOKEN="${{ secrets.SHOPWARE_COMPOSER_TOKEN }}"
          if [[ -z "$SHOPWARE_COMPOSER_TOKEN" ]]; then
            SHOPWARE_COMPOSER_TOKEN=$(printf '%s' '${{ secrets.BUILD_TIME_SECRETS }}' | jq -r '."shopware-composer-token" // empty' 2>/dev/null || true)
          fi
          if [[ -n "$SHOPWARE_COMPOSER_TOKEN" ]]; then
            echo "::add-mask::$SHOPWARE_COMPOSER_TOKEN"
            composer --working-dir=${{ inputs.SHOPWARE_ROOT }} config --global --auth bearer.packages.shopware.com "$SHOPWARE_COMPOSER_TOKEN"
          fi
          install_exit=0
          if [ ! -f "${{ inputs.SHOPWARE_ROOT }}/composer.lock" ]; then
            set +e
            composer --working-dir=${{ inputs.SHOPWARE_ROOT }} install --prefer-dist --no-scripts --ignore-platform-reqs > /tmp/composer-install.txt 2>&1
            install_exit=$?
            set -e
            cat /tmp/composer-install.txt
          fi
          {
            cat /tmp/composer-install.txt 2>/dev/null || true
            composer --working-dir=${{ inputs.SHOPWARE_ROOT }} audit --abandoned=report --locked --no-dev --format=json > /tmp/composer-audit.json 2>/dev/null || true
            composer --working-dir=${{ inputs.SHOPWARE_ROOT }} audit --abandoned=report --locked --no-dev || true
            jq '[.packages[] | {name, version}]' "${{ inputs.SHOPWARE_ROOT }}/composer.lock" > /tmp/composer-packages.json 2>/dev/null || echo '[]' > /tmp/composer-packages.json
          } 2>&1 | tee /tmp/composer-audit.txt || true
          [ "$install_exit" -eq 0 ] || exit 1
          high_critical_count=$(jq '[.advisories // {} | to_entries[] | .value[] | select(.ignored != true and (.severity == "high" or .severity == "critical"))] | length' /tmp/composer-audit.json 2>/dev/null || echo 0)
          [ "$high_critical_count" -eq 0 ]

      - name: Run Semgrep SAST scan
        id: semgrep-scan
        continue-on-error: true
        run: |
          pip install semgrep --quiet --break-system-packages
          semgrep scan \
            --config p/php \
            --config p/javascript \
            --config p/github-actions \
            --config p/typescript \
            --error \
            --json-output /tmp/semgrep.json \
            . 2>&1 | tee /tmp/semgrep.txt
          exit ${PIPESTATUS[0]}
        env:
          SEMGREP_SEND_METRICS: off

      - name: Upload scan results
        if: always()
        run: |
          mkdir -p scan-results
          cp /tmp/npm-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/npm-raw-*.json scan-results/ 2>/dev/null || true
          cp /tmp/npm-packages-*.json scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.json scan-results/ 2>/dev/null || true
          cp /tmp/composer-packages.json scan-results/ 2>/dev/null || true
          cp /tmp/semgrep.txt scan-results/ 2>/dev/null || true
          cp /tmp/semgrep.json scan-results/ 2>/dev/null || true

      - name: Upload scan results artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-results
          path: scan-results/
          if-no-files-found: ignore

      - name: Fail if any scan found issues
        if: >-
          steps.npm-scan.outcome == 'failure' ||
          steps.composer-scan.outcome == 'failure' ||
          steps.semgrep-scan.outcome == 'failure'
        run: |
          echo "One or more vulnerability scans found issues - see PR comment for details"
          exit 1

  build:
    name: Build and scan ${{ matrix.name }} image
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: init
            dockerfile: ${{ inputs.INIT_DOCKERFILE }}
            target: ${{ inputs.INIT_DOCKER_TARGET }}
          - name: php
            dockerfile: ${{ inputs.PHP_DOCKERFILE }}
            target: ${{ inputs.PHP_DOCKER_TARGET }}
          - name: supervisord
            dockerfile: ${{ inputs.SUPERVISORD_DOCKERFILE }}
            target: ${{ inputs.SUPERVISORD_TARGET }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Replace local Composer dependencies with their remote counterparts
        uses: ./reusable-workflow/.github/actions/replace-local-composer-dependencies
        with:
          SHOPWARE_ROOT: ${{ inputs.SHOPWARE_ROOT }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}

      - name: Set composer audit block-insecure to false
        run: |
          composer config --file ${{ inputs.SHOPWARE_ROOT }}/composer.json --no-plugins audit.block-insecure false

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker
        with:
          DRIVER: docker

      - name: Build ${{ matrix.name }} image
        if: matrix.name != 'init' || inputs.INIT
        uses: ./reusable-workflow/.github/actions/build-and-push-shopware-image
        with:
          DOCKERFILE_TARGET: ${{ matrix.target }}
          DOCKERFILE_PATH: ${{ matrix.dockerfile }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
          PUSH: false
          TAGS: "${{ matrix.name }}:ci-${{ github.run_id }}"

      - name: Free disk space before Trivy scan if needed
        if: matrix.name != 'init' || inputs.INIT
        run: |
          FREE_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G')
          if [ "$FREE_GB" -lt 10 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            sudo swapoff -a && sudo rm -f /swapfile
          fi
        shell: bash

      - name: Run Trivy vulnerability scanner on image
        id: trivy-scan
        if: matrix.name != 'init' || inputs.INIT
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.name }}:ci-${{ github.run_id }}"
          format: "table"
          output: "trivy-${{ matrix.name }}.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}
          timeout: "15m"

      - name: Print Trivy results to log
        if: always()
        run: cat trivy-${{ matrix.name }}.txt 2>/dev/null || true

      - name: Upload Trivy results
        if: always()
        run: echo "${{ steps.trivy-scan.outcome }}" > trivy-${{ matrix.name }}-status.txt

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.txt
            trivy-${{ matrix.name }}-status.txt
          if-no-files-found: ignore

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or HIGH vulnerabilities in the ${{ matrix.name }} image"
          exit 1

  post-scan-report:
    name: Post security scan results to PR
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    needs: [vulnerability-scan, build]
    if: (success() || failure()) && github.event_name == 'pull_request' && inputs.POST_SCAN_RESULTS_TO_PR
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Post security scan results
        uses: ./reusable-workflow/.github/actions/post-scan-report
        with:
          NPM_OUTCOME: ${{ needs.vulnerability-scan.outputs.npm-outcome }}
          COMPOSER_OUTCOME: ${{ needs.vulnerability-scan.outputs.composer-outcome }}
          SEMGREP_OUTCOME: ${{ needs.vulnerability-scan.outputs.semgrep-outcome }}
          INIT: ${{ inputs.INIT }}
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-unit-tests:
    name: Run unit tests
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: ${{ inputs.RUN_UNIT_TESTS }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Run unit tests
        uses: ./reusable-workflow/.github/actions/run-unit-tests
        with:
          DOCKERFILE: ${{ inputs.INIT && inputs.INIT_DOCKERFILE || inputs.PHP_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.INIT && inputs.INIT_DOCKER_TARGET || inputs.PHP_DOCKER_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SHOPWARE_ROOT: ${{ inputs.SHOPWARE_ROOT }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
          UNIT_TESTS_DIRECTORY: ${{ inputs.UNIT_TESTS_DIRECTORY }}

  run-phpstan:
    name: Run PHPStan
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: ${{ inputs.RUN_PHPSTAN }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Setup Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Replace local Composer dependencies with their remote counterparts
        uses: ./reusable-workflow/.github/actions/replace-local-composer-dependencies
        with:
          SHOPWARE_ROOT: ${{ inputs.SHOPWARE_ROOT }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}

      - name: Run e2e tests
        uses: ./reusable-workflow/.github/actions/run-e2e-tests
        with:
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          RUN_TIME_SECRETS: ${{ secrets.RUN_TIME_SECRETS }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
          NODE_VERSION: ${{ inputs.NODE_VERSION }}
          TESTS_DIRECTORY: "${{ inputs.E2E_TESTS_DIRECTORY }}"
          HOSTNAME: "${{ inputs.E2E_TESTS_HOSTNAME }}"
          PHP_DOCKER_COMPOSE_SERVICE: ${{ inputs.PHP_DOCKER_COMPOSE_SERVICE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}

      - name: Run PHPStan
        uses: ./reusable-workflow/.github/actions/run-phpstan
        with:
          DOCKERFILE: ${{ inputs.INIT && inputs.INIT_DOCKERFILE || inputs.PHP_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.INIT && inputs.INIT_DOCKER_TARGET || inputs.PHP_DOCKER_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SHOPWARE_ROOT: ${{ inputs.SHOPWARE_ROOT }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
          PHPSTAN_ARGS: ${{ inputs.PHPSTAN_ARGS }}

  run-e2e-tests:
    name: Run e2e tests
    if: ${{ inputs.E2E_TESTS_DIRECTORY != '' }}
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/shopware-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TorqIT/shopware-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Setup Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Replace local Composer dependencies with their remote counterparts
        uses: ./reusable-workflow/.github/actions/replace-local-composer-dependencies
        with:
          SHOPWARE_ROOT: ${{ inputs.SHOPWARE_ROOT }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}

      - name: Run e2e tests
        uses: ./reusable-workflow/.github/actions/run-e2e-tests
        with:
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          RUN_TIME_SECRETS: ${{ secrets.RUN_TIME_SECRETS }}
          SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
          NODE_VERSION: ${{ inputs.NODE_VERSION }}
          TESTS_DIRECTORY: "${{ inputs.E2E_TESTS_DIRECTORY }}"
          HOSTNAME: "${{ inputs.E2E_TESTS_HOSTNAME }}"
          PHP_DOCKER_COMPOSE_SERVICE: ${{ inputs.PHP_DOCKER_COMPOSE_SERVICE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
